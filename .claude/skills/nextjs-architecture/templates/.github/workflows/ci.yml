# CI — typecheck + lint on every pull request.
#
# Next 16's build does not run ESLint, so the architecture guards in
# eslint.config.mjs are enforced here or nowhere. `next build` is the only
# detector for client/server-boundary and prerender/cache errors; run it
# locally (or add a job) for changes in those areas.

name: CI

on:
  pull_request:
  push:
    branches: [main, master]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    name: typecheck + lint
    runs-on: ubuntu-latest
    env:
      # `prisma generate` resolves env() in schema.prisma without connecting.
      DATABASE_URL: postgresql://ci:ci@localhost:5432/ci
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      # postinstall runs `prisma generate`; the typecheck needs the client types.
      - run: npm ci
      - name: Typecheck
        run: npx tsc --noEmit
      # Runs even when the typecheck failed, so one push reports both.
      - name: Lint
        if: ${{ !cancelled() }}
        run: npm run lint
